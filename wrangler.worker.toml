# Déploiement en Worker Cloudflare (site + API dans un seul Worker) : npm run deploy:worker
name = "unepagepourtoi"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

rules = [
  { type = "Data", globs = ["**/*.png", "**/*.jpg", "**/*.mp4"], fallthrough = false },
]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

[[kv_namespaces]]
binding = "PAGES_KV"
id = "cb16baada3d8421792cf0bffeda934c4"

# Anti-abus : nombre d'actions par adresse IP et par minute
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 4, period = 60 }

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1002"
simple = { limit = 40, period = 60 }
