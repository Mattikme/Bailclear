name: Veille juridique officielle
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparer les sources officielles
        run: node scripts/monitor-legal-sources.mjs
      - name: Alerter en cas de changement ou d'indisponibilité
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changes = JSON.parse(fs.readFileSync('legal-monitor-changes.json', 'utf8'));
            const relevant = changes.filter(x => x.kind === 'changed' || x.kind === 'unavailable');
            if (relevant.length) {
              const title = '[Veille juridique] Sources officielles à examiner';
              const lines = [
                'La veille a détecté une modification de contenu ou une source indisponible.',
                '',
                'Une modification de page ne prouve pas à elle seule un changement de droit. Une revue humaine doit comparer le texte, vérifier son entrée en vigueur, évaluer son impact, ajouter des tests et valider avant publication.',
                ''
              ];
              for (const x of relevant) {
                lines.push('- **' + x.label + '** — ' + x.kind);
                lines.push('  - Source : ' + x.url);
                lines.push('  - Détail : ' + (x.kind === 'changed' ? ('empreinte ' + x.previous + ' -> ' + x.current) : x.error));
              }
              const body = lines.join('\n');
              const result = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
              const existing = result.data.find(i => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
              } else {
                await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              }
            }
      - name: Enregistrer les empreintes vérifiées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-monitor-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update legal source fingerprints"
            git push
          fi
